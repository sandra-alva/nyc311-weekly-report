[project]
name = "nyc311-weekly-report"
version = "0.1.0"
description = ""
authors = [
    {name = "Sandra Alvarez",email = "s306apm@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "markdown-it-py (>=4.0.0,<5.0.0)",
    "matplotlib (>=3.9.2,<4.0.0)",
    "openai (>=1.45.0,<2.0.0)",
    "seaborn (>=0.13.2,<1.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "nyc311_weekly_report", from = "src"}]

[tool.poetry.scripts]
nyc311 = "nyc311_weekly_report.cli:main"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
